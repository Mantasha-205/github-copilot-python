<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Sudoku Game</h1>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
            aria-pressed="false">Dark mode: off</button>
  </header>
  <main>
    <div class="game-settings">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty" name="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <p id="timer" role="timer" aria-label="Elapsed game time" aria-live="off">
      Time: 00:00
    </p>
    <div id="sudoku-board" role="group" aria-label="Sudoku puzzle board"></div>
    <div class="controls">
      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check Solution</button>
      <button id="get-hint" type="button">Hint</button>
      <span id="hints-used" aria-live="polite">Hints used: 0</span>
      <span id="message" role="status" aria-live="polite"></span>
    </div>
    <section id="completion" aria-live="polite" hidden>
      <p id="completion-message"></p>
      <label for="player-name">Your name for the leaderboard:</label>
      <input id="player-name" name="player-name" type="text" maxlength="40"
             autocomplete="name">
      <button id="save-score" type="button">Save score</button>
    </section>
    <section id="leaderboard-section" aria-labelledby="leaderboard-heading">
      <h2 id="leaderboard-heading">Top 10 Fastest Games</h2>
      <p id="leaderboard-message" role="status" aria-live="polite"></p>
      <table id="leaderboard">
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Name</th>
            <th scope="col">Time</th>
            <th scope="col">Hints used</th>
            <th scope="col">Difficulty</th>
          </tr>
        </thead>
        <tbody id="leaderboard-entries"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
